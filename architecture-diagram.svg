<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d9b1"/>
      <stop offset="100%" stop-color="#e3b688"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#c9ccd1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e3a3"/>
      <stop offset="100%" stop-color="#eec765"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#fafbfc"/>

  <text x="700" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Patient Vitals Monitoring Pipeline</text>
  <text x="700" y="72" text-anchor="middle" font-size="14" fill="#6b7280">Real-time streaming architecture on Google Cloud Platform</text>

  <!-- Simulator -->
  <rect x="40" y="230" width="150" height="100" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="115" cy="272" r="16" fill="#3b82f6"/>
  <path d="M108,272 l5,6 l12,-14" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Simulator</text>
  <text x="115" y="323" text-anchor="middle" font-size="10.5" fill="#6b7280">Python</text>

  <line x1="190" y1="280" x2="238" y2="280" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Pub/Sub -->
  <rect x="240" y="230" width="150" height="100" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="315" cy="270" r="6" fill="#f59e0b"/>
  <circle cx="295" cy="285" r="5" fill="#f59e0b"/>
  <circle cx="335" cy="285" r="5" fill="#f59e0b"/>
  <line x1="315" y1="270" x2="295" y2="285" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="315" y1="270" x2="335" y2="285" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="315" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Pub/Sub</text>
  <text x="315" y="323" text-anchor="middle" font-size="10.5" fill="#6b7280">Topic + Subscription</text>

  <line x1="390" y1="280" x2="438" y2="280" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Dataflow -->
  <rect x="440" y="220" width="170" height="120" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <path d="M470,265 h60 M470,280 h60 M470,295 h40" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <text x="525" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Dataflow</text>
  <text x="525" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Apache Beam (streaming)</text>

  <!-- Fan out to three layers -->
  <line x1="610" y1="245" x2="660" y2="140" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="280" x2="660" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="315" x2="660" y2="420" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect x="660" y="80" width="180" height="110" rx="14" fill="url(#bronzeGrad)" stroke="#b8703f" stroke-width="1.5"/>
  <text x="750" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#6b3f1c">🥉 BRONZE</text>
  <text x="750" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#3f2a12">Raw Layer</text>
  <text x="750" y="158" text-anchor="middle" font-size="10" fill="#5c4326">Unprocessed messages</text>
  <text x="750" y="172" text-anchor="middle" font-size="10" fill="#5c4326">Cloud Storage (GCS)</text>

  <!-- Silver -->
  <rect x="660" y="225" width="180" height="110" rx="14" fill="url(#silverGrad)" stroke="#8b8f96" stroke-width="1.5"/>
  <text x="750" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#3f4448">🥈 SILVER</text>
  <text x="750" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#2a2e30">Cleaned Layer</text>
  <text x="750" y="303" text-anchor="middle" font-size="10" fill="#565c60">Validated + risk-enriched</text>
  <text x="750" y="317" text-anchor="middle" font-size="10" fill="#565c60">Cloud Storage (GCS)</text>

  <!-- Gold -->
  <rect x="660" y="370" width="180" height="110" rx="14" fill="url(#goldGrad)" stroke="#b8912f" stroke-width="1.5"/>
  <text x="750" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#5c4700">🥇 GOLD</text>
  <text x="750" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#3f3200">Business-Ready Layer</text>
  <text x="750" y="448" text-anchor="middle" font-size="10" fill="#5c4d1a">Aggregated per patient</text>
  <text x="750" y="462" text-anchor="middle" font-size="10" fill="#5c4d1a">BigQuery</text>

  <!-- Merge lines to BigQuery/PowerBI -->
  <line x1="840" y1="135" x2="900" y2="280" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="840" y1="280" x2="900" y2="280" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="840" y1="425" x2="900" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- BigQuery icon node (Gold destination emphasis) -->
  <rect x="900" y="230" width="160" height="100" rx="14" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <path d="M980,255 a25,25 0 1,0 0.1,0" fill="none" stroke="#4285F4" stroke-width="3"/>
  <line x1="998" y1="273" x2="1012" y2="287" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
  <text x="980" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">BigQuery</text>
  <text x="980" y="323" text-anchor="middle" font-size="10.5" fill="#6b7280">Data Warehouse</text>

  <line x1="1060" y1="280" x2="1108" y2="280" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Power BI -->
  <rect x="1110" y="220" width="160" height="120" rx="14" fill="#ffffff" stroke="#eca62e" stroke-width="2"/>
  <rect x="1155" y="260" width="10" height="40" rx="2" fill="#f2c811"/>
  <rect x="1170" y="248" width="10" height="52" rx="2" fill="#f2c811"/>
  <rect x="1185" y="270" width="10" height="30" rx="2" fill="#f2c811"/>
  <text x="1190" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Power BI</text>
  <text x="1190" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">Live Dashboard</text>

  <!-- Legend -->
  <text x="40" y="580" font-size="11" fill="#9ca3af">Streaming pipeline · 1-minute fixed windows · Medallion Architecture (Bronze / Silver / Gold)</text>
</svg>
